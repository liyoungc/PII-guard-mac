[project]
name = "piiguard-mac"
version = "0.1.0"
description = "Local, offline name de-identification for documents on Apple Silicon (Rapid-MLX backend)."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "rapid-mlx>=1.0.3",
    "lxml>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "openpyxl>=3.1", "python-docx>=1.1", "python-pptx>=1.0"]

[project.scripts]
piiguard = "piiguard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piiguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
